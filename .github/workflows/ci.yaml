# Continuous integration.
#
# Two jobs, deliberately split. `quality` lints, trains and runs the API
# contract tests - roughly two minutes, and it is the job that answers "do the
# endpoints still return what they claim". `images` is slower, installing the
# full dependency set three times over, and exists to catch the failure the
# first job cannot see: a Dockerfile that no longer builds. Splitting them means
# a broken import does not wait on a Docker build to tell you about it.
#
# Python 3.11 throughout, matching the images and the version recorded in
# rf_demand_forecaster_meta.json. The scikit-learn pin in requirements.txt does
# the rest: the model is a pickle, and unpickling under a different version
# warns at best and changes predictions at worst.

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  # Lets a red build be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first one irrelevant. Cancelling it
# frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src DASHBOARD tests

      # Train before testing, and the ordering is the whole point.
      #
      # MODELS/*.joblib is gitignored, so a fresh clone has the database but no
      # model. Run the suite in that state and 29 of the 44 tests skip - and
      # they are precisely the ones that check the endpoints return correct
      # numbers: that /forecast reproduces the 12.77% hold-out MAPE, that
      # /predict's range guard is per-site, that /inventory matches the local
      # simulation. CI would go green having verified request validation and
      # error handling but never a single prediction.
      #
      # Training costs about a minute (300 trees, 4,320 rows) and turns those
      # skips into assertions. It also covers pipeline.py itself, which nothing
      # in tests/ imports.
      #
      # --no-tracking because there is no MLflow server on a runner, and CI
      # builds are not experiments worth recording.
      - name: Train the model
        run: python -m mig_cement.pipeline --no-tracking

      # -rs prints skip reasons. With the artefacts present nothing should skip,
      # so anything reported here is a signal that the step above did not
      # produce what the tests expect.
      - name: Test
        run: pytest tests -q -rs

  images:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nothing here can pass if the code does not, so do not spend the runner.
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only - no push, no registry credentials. This answers one
      # question: do the three Dockerfiles still produce images? The api image
      # copies MODELS/, which is absent on a runner, so it is built with a
      # placeholder rather than skipped - see below.
      - name: Create a placeholder model artefact
        # COPY MODELS/ fails outright on an empty directory, and a build failure
        # for a reason that only exists in CI teaches people to ignore CI. The
        # placeholder makes the COPY succeed; nothing in this job runs the API,
        # so its contents never matter.
        run: |
          mkdir -p MODELS
          echo "placeholder for CI - not a real model" > MODELS/rf_demand_forecaster.joblib
          echo '{"name": "ci-placeholder"}' > MODELS/rf_demand_forecaster_meta.json

      - name: Build all three images
        run: docker compose -f docker/docker-compose.yml build

      # Proves the compose file itself is coherent - service names, profiles,
      # depends_on conditions and the healthcheck syntax - which a build alone
      # does not check.
      - name: Validate the compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
