# Continuous integration.
#
# Two jobs, deliberately split. `quality` lints, trains and runs the API
# contract tests - roughly two minutes, and it is the job that answers "do the
# endpoints still return what they claim". `images` is slower, installing the
# full dependency set three times over, and exists to catch the failure the
# first job cannot see: a Dockerfile that no longer builds. Splitting them means
# a broken import does not wait on a Docker build to tell you about it.
#
# Python 3.11 throughout, matching the images and the version recorded in
# rf_demand_forecaster_meta.json. The scikit-learn pin in requirements.txt does
# the rest: the model is a pickle, and unpickling under a different version
# warns at best and changes predictions at worst.

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  # Lets a red build be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first one irrelevant. Cancelling it
# frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # requirements-dev.txt, because CI needs pytest and ruff. It layers on
      # requirements-train.txt, which layers on requirements.txt - so this
      # installs the runtime set, mlflow, the test tools and the notebook
      # packages. The images install the narrower layers.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src DASHBOARD tests

      # Train before testing, and the ordering is the point.
      #
      # The model itself is committed, so a checkout can serve predictions. What
      # is not committed is DATA/processed/ - per_site_sigma.parquet and
      # test_forecasts.parquet are gitignored derived data. Without them the API
      # falls back to one estate-wide sigma in place of per-site values, and the
      # tests that score forecasts skip. Training regenerates both, so the suite
      # asserts against real numbers rather than a fallback.
      #
      # It also exercises pipeline.py, which nothing in tests/ imports, and
      # checks the committed model can still be reproduced from the data.
      #
      # --no-tracking: no MLflow server on a runner, and CI builds are not
      # experiments worth recording.
      - name: Train the model
        run: python -m mig_cement.pipeline --no-tracking

      # -rs prints skip reasons. With the artefacts present nothing should skip,
      # so anything reported here means the step above did not produce what the
      # tests expect.
      - name: Test
        run: pytest tests -q -rs

  images:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nothing here can pass if the code does not, so do not spend the runner.
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # DATA/processed/ is gitignored, so a checkout has only .gitkeep there and
      # `COPY DATA/processed/` would copy an empty directory. The api image would
      # still build, but silently without per_site_sigma.parquet. Generating it
      # here means the image this job builds is the image a deploy would get.
      #
      # MODELS/ needs no such treatment - the model is committed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Generate the derived data the api image expects
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
          python -m mig_cement.pipeline --no-tracking

      # Build only - no push, no registry credentials. One question: do the
      # three Dockerfiles still produce images?
      - name: Build all three images
        run: docker compose -f docker/docker-compose.yml build

      # Proves the compose file itself is coherent - service names, profiles,
      # depends_on conditions and the healthcheck syntax - which a build alone
      # does not check.
      - name: Validate the compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
