name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main

            C=docker/docker-compose.yml
            O=docker/docker-compose.override.yml

            docker compose -f $C -f $O up -d --build mlflow
            docker compose -f $C -f $O run --rm --build model
            docker compose -f $C -f $O up -d --build

            sleep 20
            curl -fsS localhost:8000/health | grep -q '"model_loaded": *true'
            curl -fsS -o /dev/null localhost/
            docker compose -f $C -f $O ps
